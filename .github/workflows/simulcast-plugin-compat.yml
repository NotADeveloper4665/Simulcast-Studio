name: OBS plugin compatibility (Fedora)
on:
  push:
    branches: [feature/obs-plugin-compatibility]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulcast-plugin-compat
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 90
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf -y install git ca-certificates dnf5-plugins cmake ninja-build extra-cmake-modules clang gcc gcc-c++ curl rpm-build pkgconf-pkg-config findutils which tar gzip xz patch python3
          dnf -y install https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
          dnf -y builddep obs-studio
          dnf -y install onnxruntime onnxruntime-devel clang-devel
          dnf -y install x264-devel obs-studio-devel binutils xorg-x11-server-Xvfb xorg-x11-xauth nss nspr atk at-spi2-atk at-spi2-core cups-libs libXcomposite libXdamage libXrandr libXcursor libXi libXtst libxkbcommon libdrm mesa-libgbm alsa-lib gtk3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Fetch pinned Chromium Embedded Framework
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' -o /tmp/simulcast-cef.tar.xz https://github.com/obs-rust/cef/releases/download/8078-r2/cef_binary_8078_linux_x86_64.tar.xz
          echo 'dc463c360d4b8e4eb482fa78a5b92b996b053a4a8650dba3052c89390430ac9c  /tmp/simulcast-cef.tar.xz' | sha256sum -c -
          mkdir -p /opt/simulcast-cef
          tar -xJf /tmp/simulcast-cef.tar.xz -C /opt/simulcast-cef
          header=$(find /opt/simulcast-cef -path '*/include/cef_version.h' -print -quit)
          test -f "$header"
          cef_root=$(dirname "$(dirname "$header")")
          test -f "$cef_root/Release/libcef.so"
          echo "CEF_ROOT_DIR=$cef_root" >> "$GITHUB_ENV"
      - name: Configure and compile
        shell: bash
        run: |
          export CARGO_HOME=/opt/simulcast-cargo
          export RUSTUP_HOME=/opt/simulcast-rustup
          export PATH="$CARGO_HOME/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/simulcast-rustup.sh
          sh /tmp/simulcast-rustup.sh -y --profile minimal --default-toolchain 1.98.1 --no-modify-path
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cmake --preset fedora -DENABLE_SIMULCAST_BACKGROUND_REMOVAL=ON -DENABLE_SIMULCAST_GPU_BACKGROUND_REMOVAL=ON -DENABLE_BROWSER=ON -DCEF_ROOT_DIR="$CEF_ROOT_DIR" -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF -DOBS_VERSION_OVERRIDE=33.0.0 -DOBS_RUST_VERSION=0.1.0
          cmake --build build_fedora --parallel 4
      - name: Build and test native Rust background removal
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/simulcast-cargo/bin:$PATH"
          export CARGO_HOME=/opt/simulcast-cargo RUSTUP_HOME=/opt/simulcast-rustup
          export OBS_INCLUDE_DIR="$PWD/libobs" OBS_CONFIG_DIR="$PWD/build_fedora/config"
          libobs=$(find "$PWD/build_fedora" -name libobs.so -print -quit)
          test -f "$libobs"
          export OBS_LIB_DIR="$(dirname "$libobs")"
          export LD_LIBRARY_PATH="$OBS_LIB_DIR"
          runtime=$(rpm -ql onnxruntime | awk '/\/libonnxruntime[.]so[.][0-9]+([.][0-9]+)*$/ && !found {print; found=1}')
          test -f "$runtime"
          export SIMULCAST_ORT_PATH="$runtime"
          export SIMULCAST_MODEL_PATH=/tmp/mediapipe-landscape.onnx
          curl --fail --location --retry 3 --proto '=https' -o "$SIMULCAST_MODEL_PATH" https://huggingface.co/onnx-community/mediapipe_selfie_segmentation_landscape/resolve/2497d5bec26c626c7b3c4edc6e1fefc21b64f6c3/onnx/model.onnx
          echo "7a0adcfdb1715d3b0ff0f61486d8a181c33f4a208343a5abfccbc6540e872d24  $SIMULCAST_MODEL_PATH" | sha256sum -c -
          cd plugins/rust-background-removal
          export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/../..'
          cargo test --lib
          cargo build --release
      - name: Package and validate Fedora RPM
        shell: bash
        run: |
          set -euo pipefail
          rpm_release=$((GITHUB_RUN_NUMBER + 5))
          cpack --config build_fedora/CPackConfig.cmake -G RPM -B build_fedora/rpm -D CPACK_PACKAGE_VERSION=0.1.0 -D CPACK_RPM_PACKAGE_RELEASE="$rpm_release" -D "CPACK_RPM_PACKAGE_REQUIRES=onnxruntime >= 1.22"
          mkdir -p dist
          cp build_fedora/rpm/simulcast-studio-*.fc44.x86_64.rpm dist/
          rpm_file=$(find dist -maxdepth 1 -name '*.rpm')
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          test "$(rpm -qp --qf '%{NAME} %{ARCH}' "$rpm_file")" = 'simulcast-studio x86_64'
          rpm -qpl "$rpm_file" | tee /tmp/simulcast-package-files
          grep -Fx /usr/bin/simulcast-studio /tmp/simulcast-package-files
          dnf -y install "$rpm_file"
          ldd /usr/bin/simulcast-studio | tee /tmp/simulcast-ldd
          if grep -q 'not found' /tmp/simulcast-ldd; then exit 1; fi
          QT_QPA_PLATFORM=offscreen simulcast-studio --version
          test -f /usr/lib64/obs-studio-rust/obs-modules/plugins/simulcast-background-removal.so
          ldd /usr/lib64/obs-studio-rust/obs-modules/plugins/simulcast-background-removal.so | tee dist/background-removal-ldd.txt
          if grep -q 'not found' dist/background-removal-ldd.txt; then exit 1; fi
          core=/usr/lib64/obs-studio-rust/obs-modules/core
          for file in simulcast-gpu-background-removal.so obs-browser.so obs-browser-page libcef.so icudtl.dat resources.pak v8_context_snapshot.bin chrome-sandbox; do
            test -f "$core/$file"
          done
          test -d "$core/locales"
          ldd "$core/simulcast-gpu-background-removal.so" | tee dist/gpu-background-removal-ldd.txt
          if grep -q 'not found' dist/gpu-background-removal-ldd.txt; then exit 1; fi
          ldd "$core/obs-browser.so" | tee dist/browser-module-ldd.txt
          ldd "$core/obs-browser-page" | tee dist/browser-helper-ldd.txt
          if grep -q 'not found' dist/browser-*-ldd.txt; then exit 1; fi
          (cd dist && sha256sum *.rpm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: simulcast-compatibility-candidate-rpm
          path: dist/*.rpm
          if-no-files-found: error
      - name: Compile independent stock OBS plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stock-probe/data
          rpm -q obs-studio-devel
          header=$(rpm -ql obs-studio-devel | awk '/\/obs-module[.]h$/ && !found {print; found=1}')
          test -f "$header"
          sdk_include=$(dirname "$header")
          cc -shared -fPIC ci/plugin-compat/stock-filter.c -o /tmp/stock-probe/stock-filter.so -I"$sdk_include" $(pkg-config --cflags --libs libobs)
          cc ci/plugin-compat/load-filter.c -o /tmp/stock-probe/load-filter -I"$sdk_include" $(pkg-config --cflags --libs libobs)
          xvfb-run -a /tmp/stock-probe/load-filter /tmp/stock-probe/stock-filter.so /tmp/stock-probe/data
      - name: Verify external plugin against installed Simulcast
        shell: bash
        run: |
          set -euo pipefail
          candidate=/usr/lib64/obs-studio-rust
          test -f "$candidate/libobs.so.30"
          LD_LIBRARY_PATH="$candidate" ldd /tmp/stock-probe/load-filter | tee dist/plugin-probe-ldd.txt
          grep -F "$candidate/libobs.so.30" dist/plugin-probe-ldd.txt
          xvfb-run -a env LD_LIBRARY_PATH="$candidate" /tmp/stock-probe/load-filter /tmp/stock-probe/stock-filter.so /tmp/stock-probe/data | tee dist/plugin-probe-result.txt
          xvfb-run -a env LD_LIBRARY_PATH="$candidate" /tmp/stock-probe/load-filter "$candidate/obs-modules/plugins/simulcast-background-removal.so" /usr/share/obs-studio-rust/obs-modules/plugins/simulcast-background-removal simulcast_onnx_background_removal "AI Background Removal (Simulcast)" | tee dist/background-removal-registration.txt
          xvfb-run -a env LD_LIBRARY_PATH="$candidate" /tmp/stock-probe/load-filter "$candidate/obs-modules/core/simulcast-gpu-background-removal.so" /usr/share/obs-studio-rust/obs-modules/core/simulcast-gpu-background-removal simulcast_gpu_background_removal "AI Background Removal (GPU)" | tee dist/gpu-background-removal-registration.txt
          python3 ci/plugin-compat/compare-symbols.py /usr/lib64/libobs.so.30 "$candidate/libobs.so.30" | tee dist/libobs-symbol-report.txt
          python3 ci/plugin-compat/compare-symbols.py /usr/lib64/libobs-frontend-api.so.30 "$candidate/libobs-frontend-api.so.30" | tee dist/frontend-symbol-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: simulcast-obs-plugin-compatibility
          path: dist/*
          if-no-files-found: error
